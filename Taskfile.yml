# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'
output: prefixed

tasks:
  default:
    desc: List supported schema-first development commands
    cmd: task --list

  bootstrap:
    desc: Download the supported Go dependencies and materialize generated code
    dir: ./goforms
    cmds:
      - go mod download
      - go generate ./...

  generate:
    desc: Regenerate committed mocks and other generated Go artifacts
    dir: ./goforms
    cmd: go generate ./...

  build:
    desc: Build the supported Go API
    dir: ./goforms
    cmd: go build ./...

  test:
    desc: Run all Go tests with the race detector
    dir: ./goforms
    cmd: go test -race ./...

  contract:
    desc: Validate the versioned OpenAPI and canonical JSON Schema contracts
    dir: ./goforms
    cmds:
      - npm ci
      - npm run contract:lint
      - go test -race ./contracts/...

  lint:
    desc: Run static analysis with the pinned local golangci-lint
    dir: ./goforms
    cmds:
      - go vet ./...
      - golangci-lint run ./...

  vuln:
    desc: Scan reachable Go code with a pinned govulncheck
    dir: ./goforms
    cmd: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  verify:
    desc: Run the deterministic local/CI verification contract
    dir: ./goforms
    cmds:
      - go generate ./...
      - git diff --exit-code -- test/mocks
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum
      - go vet ./...
      - golangci-lint run ./...
      - go test -race ./...
      - go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  dev:
    desc: Run the supported Go API with Air
    dir: ./goforms
    cmd: air -c .air.toml

  migrate:up:
    desc: Apply supported Postgres migrations
    dir: ./goforms
    cmd: task migrate:up

  migrate:down:
    desc: Roll back one supported Postgres migration
    dir: ./goforms
    cmd: task migrate:down

  legacy:web:
    desc: Explain the status of the retained human-first code
    cmd: echo "goformx-web and goformx-formio are legacy reference code; see issue #83."
