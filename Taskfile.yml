# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'
output: prefixed

tasks:
  default:
    desc: List supported schema-first development commands
    cmd: task --list

  bootstrap:
    desc: Download the supported Go dependencies and materialize generated code
    dir: ./goforms
    cmds:
      - go mod download
      - go generate ./...
      - npm ci
      - npm run contract:generate

  generate:
    desc: Regenerate committed mocks and other generated Go artifacts
    dir: ./goforms
    cmd: go generate ./...

  build:
    desc: Build the supported Go API
    dir: ./goforms
    cmd: go build ./...

  test:
    desc: Run all Go tests with the race detector
    dir: ./goforms
    cmd: go test -race ./...

  contract:
    desc: Validate the versioned OpenAPI and canonical JSON Schema contracts
    dir: ./goforms
    cmds:
      - npm ci
      - npm run contract:lint
      - npm run contract:check
      - go test -race ./contracts/...

  lint:
    desc: Run static analysis with the pinned golangci-lint module
    dir: ./goforms
    cmds:
      - go vet ./...
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

  vuln:
    desc: Scan reachable Go code with a pinned govulncheck
    dir: ./goforms
    cmd: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  packaging:
    desc: Build and check API/default and maintenance images without credentials or network access at runtime
    dir: ./goforms
    cmd: sh docker/production/verify.sh

  verify:
    desc: Run the complete read-only local/CI verification contract with disposable PostgreSQL
    cmds:
      # The wrapper (not a Task defer, whose exit status Task ignores) owns the
      # uniquely named Compose project, exports GOFORMX_TEST_DATABASE_URL, and
      # always tears the project down; see docs/testing-strategy.md.
      - sh goforms/docker/verify/with-postgres.sh -- task verify:gates

  verify:gates:
    desc: Run every verification gate against the disposable PostgreSQL that task verify provisions
    dir: ./goforms
    preconditions:
      - sh: test -n "${GOFORMX_TEST_DATABASE_URL:-}"
        msg: GOFORMX_TEST_DATABASE_URL is unset; run `task verify`, which provisions the disposable PostgreSQL and exports its URL
    cmds:
      - >-
        go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
        -path migrations/postgresql -database "$GOFORMX_TEST_DATABASE_URL" up
      - >-
        go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
        -path migrations/postgresql -database "$GOFORMX_TEST_DATABASE_URL" down 1
      - >-
        go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
        -path migrations/postgresql -database "$GOFORMX_TEST_DATABASE_URL" up 1
      - npm ci
      - npm run contract:lint
      - npm run contract:check
      - go generate ./...
      - git diff --exit-code -- test/mocks
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum
      - go vet ./...
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...
      - go test -race ./...
      - >-
        go test -race -coverprofile=.coverage.out
        ./internal/domain/form/model
        ./internal/domain/submission
        ./internal/application/validation
        ./internal/application/middleware/serviceauth
        ./internal/application/handlers/web
        ./internal/infrastructure/database
        ./internal/infrastructure/logging
      - go run ./internal/tools/coveragegate -profile .coverage.out -minimum 37
      - go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - task: packaging

  dev:
    desc: Run the supported Go API with Air
    dir: ./goforms
    cmd: air -c .air.toml

  migrate:up:
    desc: Apply supported Postgres migrations
    dir: ./goforms
    cmd: task migrate:up

  migrate:down:
    desc: Roll back one supported Postgres migration
    dir: ./goforms
    cmd: task migrate:down
