services:
  # GoForms Application (Development)
  goforms-dev:
    build:
      context: .
      dockerfile: docker/development/Dockerfile
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    ports:
      - "8090:8090"
    environment:
      # Application Configuration
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL}
      - APP_SCHEME=${APP_SCHEME}
      - APP_PORT=${APP_PORT}
      # Listen on all interfaces so port 8090 is reachable from host (e.g. DDEV → host.docker.internal:8090)
      - APP_HOST=${APP_HOST:-0.0.0.0}

      # Database Configuration (mapped to Viper's DATABASE_ prefix)
      # Host must match the postgres service name on the Compose network
      - DATABASE_DRIVER=${DB_DRIVER}
      - DATABASE_HOST=postgres-dev
      - DATABASE_PORT=${DB_PORT}
      - DATABASE_NAME=${DB_NAME}
      - DATABASE_USERNAME=${DB_USERNAME}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS}
      - DATABASE_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS}

      # Security Configuration
      - SESSION_SECRET=${SESSION_SECRET}
      - SECURITY_CSRF_SECRET=${SECURITY_CSRF_SECRET}
      - SECURE_COOKIES=${SECURE_COOKIES}

      # CSP Configuration
      - SECURITY_CSP_SCRIPT_SRC=${SECURITY_CSP_SCRIPT_SRC}
      - SECURITY_CSP_STYLE_SRC=${SECURITY_CSP_STYLE_SRC}
      - SECURITY_CSP_CONNECT_SRC=${SECURITY_CSP_CONNECT_SRC}

      # CORS Configuration
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS}
      - CORS_MAX_AGE=${CORS_MAX_AGE}
      - SECURITY_RATE_LIMIT_PUBLIC_SUBMISSION_RPS=${SECURITY_RATE_LIMIT_PUBLIC_SUBMISSION_RPS:-1}
      - SECURITY_RATE_LIMIT_PUBLIC_SUBMISSION_BURST=${SECURITY_RATE_LIMIT_PUBLIC_SUBMISSION_BURST:-10}
      - SECURITY_RATE_LIMIT_SUBMISSIONS_PER_DAY=${SECURITY_RATE_LIMIT_SUBMISSIONS_PER_DAY:-1000}
      - WEBHOOK_ENABLED=${WEBHOOK_ENABLED:-false}
      - WEBHOOK_ENCRYPTION_KEY=${WEBHOOK_ENCRYPTION_KEY:-}
      - WEBHOOK_POLL_INTERVAL=${WEBHOOK_POLL_INTERVAL:-1s}
      - WEBHOOK_REQUEST_TIMEOUT=${WEBHOOK_REQUEST_TIMEOUT:-10s}
      - WEBHOOK_LOCK_TIMEOUT=${WEBHOOK_LOCK_TIMEOUT:-30s}
      - WEBHOOK_MAX_ATTEMPTS=${WEBHOOK_MAX_ATTEMPTS:-8}
      - WEBHOOK_BACKOFF_BASE=${WEBHOOK_BACKOFF_BASE:-5s}
      - WEBHOOK_BACKOFF_MAX=${WEBHOOK_BACKOFF_MAX:-1h}

      # Timeouts
      - READ_TIMEOUT=${READ_TIMEOUT}
      - WRITE_TIMEOUT=${WRITE_TIMEOUT}
      - IDLE_TIMEOUT=${IDLE_TIMEOUT}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT}
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - goforms-dev-network
    volumes:
      - .:/app
      - go-cache:/go
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database (Development)
  postgres-dev:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - goforms-dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  goforms-dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
    driver: local
  go-cache:
    driver: local
