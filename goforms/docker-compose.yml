services:
  # GoForms Application (Development)
  goforms-dev:
    build:
      context: .
      dockerfile: docker/development/Dockerfile
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - path: .env
        required: false
    ports:
      - "8090:8090"
    environment:
      # Application Configuration
      - APP_NAME=${APP_NAME}
      - APP_ENVIRONMENT=${APP_ENVIRONMENT}
      - APP_DEBUG=${APP_DEBUG}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL}
      - APP_SCHEME=${APP_SCHEME}
      - APP_PORT=${APP_PORT}
      # Listen on all interfaces so port 8090 is reachable from host (e.g. DDEV → host.docker.internal:8090)
      - APP_HOST=${APP_HOST:-0.0.0.0}

      # Database Configuration
      # Host must match the postgres service name on the Compose network
      - DB_DRIVER=${DB_DRIVER}
      - DB_HOST=postgres-dev
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS}

      - SECURITY_RATE_LIMIT_ENABLED=${SECURITY_RATE_LIMIT_ENABLED:-true}
      - SECURITY_RATE_LIMIT_RPS=${SECURITY_RATE_LIMIT_RPS:-100}
      - SECURITY_RATE_LIMIT_BURST=${SECURITY_RATE_LIMIT_BURST:-200}
      - SECURITY_RATE_LIMIT_PUBLIC_SUBMISSION_RPS=${SECURITY_RATE_LIMIT_PUBLIC_SUBMISSION_RPS:-1}
      - SECURITY_RATE_LIMIT_PUBLIC_SUBMISSION_BURST=${SECURITY_RATE_LIMIT_PUBLIC_SUBMISSION_BURST:-10}
      - SECURITY_RATE_LIMIT_SUBMISSIONS_PER_DAY=${SECURITY_RATE_LIMIT_SUBMISSIONS_PER_DAY:-1000}
      - WEBHOOK_ENABLED=${WEBHOOK_ENABLED:-false}
      - WEBHOOK_ENCRYPTION_KEY=${WEBHOOK_ENCRYPTION_KEY:-}
      - WEBHOOK_ENCRYPTION_KEYRING=${WEBHOOK_ENCRYPTION_KEYRING:-}
      - WEBHOOK_ACTIVE_ENCRYPTION_KEY_ID=${WEBHOOK_ACTIVE_ENCRYPTION_KEY_ID:-}
      - WEBHOOK_POLL_INTERVAL=${WEBHOOK_POLL_INTERVAL:-1s}
      - WEBHOOK_REQUEST_TIMEOUT=${WEBHOOK_REQUEST_TIMEOUT:-10s}
      - WEBHOOK_LOCK_TIMEOUT=${WEBHOOK_LOCK_TIMEOUT:-30s}
      - WEBHOOK_MAX_ATTEMPTS=${WEBHOOK_MAX_ATTEMPTS:-8}
      - WEBHOOK_BACKOFF_BASE=${WEBHOOK_BACKOFF_BASE:-5s}
      - WEBHOOK_BACKOFF_MAX=${WEBHOOK_BACKOFF_MAX:-1h}

      - APP_READ_TIMEOUT=${APP_READ_TIMEOUT:-15s}
      - APP_WRITE_TIMEOUT=${APP_WRITE_TIMEOUT:-15s}
      - APP_IDLE_TIMEOUT=${APP_IDLE_TIMEOUT:-60s}
      - APP_REQUEST_TIMEOUT=${APP_REQUEST_TIMEOUT:-30s}
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - goforms-dev-network
    volumes:
      - .:/app
      - go-cache:/go
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database (Development)
  postgres-dev:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - goforms-dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  goforms-dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
    driver: local
  go-cache:
    driver: local
