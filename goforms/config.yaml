security:
  first_party:
    enabled: false
    issuer: https://goformx.com
    audience: https://api.goformx.com
    jwks_url: https://goformx.com/.well-known/goformx-control-plane-jwks.json
    jwks_snapshot: ""
    refresh_interval: 30s
  rate_limit:
    enabled: true
    rps: 100
    burst: 200
    public_submission_rps: 1
    public_submission_burst: 10
    submissions_per_day: 1000

webhook:
  enabled: false
  encryption_key: ""
  poll_interval: 1s
  request_timeout: 10s
  lock_timeout: 30s
  max_attempts: 8
  backoff_base: 5s
  backoff_max: 1h
