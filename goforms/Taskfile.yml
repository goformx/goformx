# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'
output: prefixed

includes:
  migrate:
    taskfile: tasks/Taskfile.migrate.yml
    namespace: migrate

dotenv: ['.env']

vars:
  VERSION:
    sh: git describe --tags --always --dirty
  BUILD_TIME:
    sh: date -u '+%Y-%m-%d_%H:%M:%S'
  GIT_COMMIT:
    sh: git rev-parse HEAD
  GO_VERSION:
    sh: go version | cut -d ' ' -f 3
  LDFLAGS: >-
    -s -w
    -X github.com/goformx/goforms/internal/infrastructure/version.Version={{.VERSION}}
    -X github.com/goformx/goforms/internal/infrastructure/version.BuildTime={{.BUILD_TIME}}
    -X github.com/goformx/goforms/internal/infrastructure/version.GitCommit={{.GIT_COMMIT}}
    -X github.com/goformx/goforms/internal/infrastructure/version.GoVersion={{.GO_VERSION}}

tasks:
  default:
    desc: List supported Go service commands
    cmd: task --list

  install:
    desc: Install pinned interactive development tools
    cmds:
      - go install github.com/air-verse/air@v1.67.4
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

  generate:
    desc: Regenerate committed mocks
    sources:
      - internal/**/*.go
      - '!internal/**/*_test.go'
      - '!test/mocks/**/*.go'
    generates:
      - test/mocks/**/*.go
    cmd: go generate ./...

  build:
    desc: Generate and build the API
    deps: [generate]
    cmds:
      - task: build:backend

  build:backend:
    desc: Build the API binary
    cmd: go build -ldflags "{{.LDFLAGS}}" -o bin/goforms main.go

  dev:
    desc: Run the API with pinned Air installed by task install
    cmd: air -c .air.toml

  lint:
    desc: Run static analysis
    cmds:
      - go vet ./...
      - golangci-lint run ./...

  test:
    desc: Run every Go test with the race detector
    deps: [generate]
    cmd: go test -race ./...

  contract:
    desc: Validate the versioned OpenAPI and canonical JSON Schema contracts
    cmds:
      - npm ci
      - npm run contract:lint
      - go test -race ./contracts/...

  test:cover:
    desc: Generate race-enabled coverage for all supported packages
    deps: [generate]
    cmds:
      - go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  vuln:
    desc: Scan reachable code with pinned govulncheck
    cmd: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  verify:
    desc: Run the service verification contract
    cmds:
      - go generate ./...
      - git diff --exit-code -- test/mocks
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum
      - go vet ./...
      - golangci-lint run ./...
      - go test -race ./...
      - go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  clean:
    desc: Remove local build and coverage artifacts
    cmds:
      - rm -rf bin tmp coverage.out coverage.html
