version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
  settings:
    govet:
      disable:
        - inline
    gosec:
      excludes:
        - G101 # Configuration field names are not embedded credentials.
        - G117 # Password/secret DTO fields are reviewed at their trust boundary.
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Legacy browser-session middleware is scheduled for deletion in #73/#83.
      # Keep this narrow exception visible until that package is removed.
      - path: internal/application/middleware/session/.*\.go
        linters: [gosec]
        text: "G(124|703)"
      - path: _test\.go
        linters: [gosec, noctx]

issues:
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict
