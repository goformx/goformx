name: goformx-verify

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: goformx
      POSTGRES_USER: goformx
      POSTGRES_PASSWORD: testpass
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goformx -d goformx"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
