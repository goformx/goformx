# Disposable verification database. `task verify` runs this file through
# docker/verify/with-postgres.sh, which overrides the project name below with a
# per-run `goformx-verify-<id>` name and reads the ephemeral loopback port it
# publishes, so concurrent or leaked runs never share containers or ports.
name: goformx-verify

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: goformx
      POSTGRES_USER: goformx
      POSTGRES_PASSWORD: testpass
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goformx -d goformx"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
