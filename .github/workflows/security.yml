name: Security Scan

on:
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'goforms/**'
      - '.github/workflows/security.yml'
      - '.github/codeql-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'goforms/**'
      - '.github/workflows/security.yml'
      - '.github/codeql-config.yml'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: goforms/go.mod
          cache: true
          cache-dependency-path: goforms/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: go
          queries: security-extended
          config-file: ./.github/codeql-config.yml

      - name: Build supported Go runtime
        working-directory: ./goforms
        run: |
          go generate ./...
          go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:go

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
