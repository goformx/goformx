name: Security Scan

on:
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'goforms/**'
      - '.github/workflows/security.yml'
      - '.github/codeql-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'goforms/**'
      - '.github/workflows/security.yml'
      - '.github/codeql-config.yml'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: goforms/go.mod
          cache: true
          cache-dependency-path: goforms/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended
          config-file: ./.github/codeql-config.yml

      - name: Build supported Go runtime
        working-directory: ./goforms
        run: |
          go generate ./...
          go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:go

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        # The action reports unsupported until the organization enables GitHub's dependency graph.
        # Keep the signal visible without blocking verified dependency updates; tracked in #75.
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
